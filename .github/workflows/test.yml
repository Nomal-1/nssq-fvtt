name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # data/*.json이 data/raw와 어긋나지 않았는지 확인
      - run: npm run build:data
      - run: git diff --exit-code -- data
      - run: npm run build:packs
