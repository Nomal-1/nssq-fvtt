name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build:packs
      - run: node tools/package.mjs "${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nssq.zip
            dist/system.json
          generate_release_notes: true
